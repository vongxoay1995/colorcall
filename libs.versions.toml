[versions]
# Plugin
agp = "9.0.0"
kotlin = "2.2.20"
media3Exoplayer = "1.8.0"
play-service = "4.4.4"
firebase-crashlytics = "3.0.6"
ksp = "2.2.20-2.0.3"

# SDK Versions
compile-sdk = "36"
min-sdk = "24"
target-sdk = "36"

# AndroidX Core
coreKtx = "1.17.0"
appcompat = "1.7.1"
coordinatorlayout = "1.3.0"
pagingRuntimeKtx = "3.3.6"
constraintlayout = "2.2.1"
material = "1.13.0"
activity = "1.11.0"
exifinterface = "1.4.1"

# Google Play
playServicesAds = "24.8.0"
billing = "8.0.0"
review = "2.0.2"
userMessagingPlatform = "3.2.0"

# Firebase
firebase-bom = "34.6.0"

# Retrofit
retrofit = "3.0.0"
okhttp3 = "5.2.1"

# Glide
glide = "5.0.5"
glideTransformations = "4.3.0"

# Koin
koinCore = "4.1.1"

# Common
lottie = "6.6.10"
gson = "2.13.2"
roomCompiler = "2.8.2"
sdp = "1.1.1"
eventBus = "3.3.1"

# Object segmentation
segmentationVersion = "16.0.0-beta1"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# Eco ads
adsSdk = "3.0.8"
appInstallSdk = "1.0.2"

#gpuimage
gpuImageSdk = "3.1.0-16k-min"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }

androidx-paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "pagingRuntimeKtx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Google Play
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
review = { module = "com.google.android.play:review", version.ref = "review" }
user-messaging-platform = { module = "com.google.android.ump:user-messaging-platform", version.ref = "userMessagingPlatform" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
okhttp3-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3" }

# Glide
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-transformations = { module = "jp.wasabeef:glide-transformations", version.ref = "glideTransformations" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinCore" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koinCore" }

# Common
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomCompiler" }
sdp = { module = "com.intuit.sdp:sdp-android", version.ref = "sdp" }
event-bus = { module = "org.greenrobot:eventbus", version.ref = "eventBus" }

# Object segmentation
segmentation = { module = "com.google.android.gms:play-services-mlkit-subject-segmentation", version.ref = "segmentationVersion" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

#media3
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3Exoplayer" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Exoplayer" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Exoplayer" }

#gpu image

gpu-image-sdk = { module = "org.wysaid:gpuimage-plus", version.ref = "gpuImageSdk" }


# Eco ads
ads-sdk = { module = "com.ecomobileapp:ads-sdk", version.ref = "adsSdk" }
app-install-sdk = { module = "com.ecomobileapp:app-install-sdk", version.ref = "appInstallSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
play-services = { id = "com.google.gms.google-services", version.ref = "play-service" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics" }

